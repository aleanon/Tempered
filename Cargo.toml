
[package]
name = "tempered"
description = "Composable authentication for Rust web services: JWT, sessions and API keys, with 2FA, passkeys, OAuth2/OIDC and more, auto-wired into axum"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Everything on by default; slim consumers (e.g. in-memory JWT only) use
# `tempered = { default-features = false }` and skip compiling sqlx/redis/reqwest.
default = ["postgres", "redis", "oauth-client", "postmark-email"]
postgres = ["tempered_adapters/postgres"]
redis = ["tempered_adapters/redis"]
oauth-client = ["tempered_adapters/oauth-client"]
postmark-email = ["tempered_adapters/postmark-email"]
# The store contract tests, as `tempered::testing`, for your own stores.
testing = ["tempered_adapters/testing"]
# Request and rate-limit counters through the `metrics` facade.
metrics = ["tempered_adapters/metrics"]
# BreachedPasswordCheck, a password policy using the HIBP range API.
breached-passwords = ["tempered_adapters/breached-passwords"]
# The production passkey verifier (links OpenSSL; not in `default`).
passkeys-webauthn = ["tempered_adapters/passkeys-webauthn"]

[dependencies]
# Internal crates - re-export all public APIs
tempered_core.workspace = true
tempered_adapters = { path = "src/tempered_adapters", version = "0.1.0", default-features = false }
tempered_axum.workspace = true

# Re-export key dependencies that are part of the public API
async-trait.workspace = true
secrecy.workspace = true
axum.workspace = true
tokio.workspace = true
http.workspace = true


[dev-dependencies]
redis.workspace = true
thiserror.workspace = true
tower.workspace = true
reqwest.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing-error.workspace = true
tracing-subscriber.workspace = true


# Run the example's own tests with `cargo test` (it is the only check that
# the composition still fits the traits).
[[example]]
name = "composed_scheme"
test = true

[workspace]
resolver = "2"
members = [
    "src/tempered_core",
    "src/tempered_adapters",
    "src/tempered_axum",
    "examples/api_key_axum",
    "examples/oauth_axum",
    "examples/passkey_axum",
    "examples/jwt_standalone",
    "examples/session_axum",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The oldest toolchain that builds every feature (CI's `msrv` job checks it).
rust-version = "1.91"
repository = "https://github.com/aleanon/Tempered"
keywords = ["authentication", "jwt", "session", "passkey", "oauth"]
categories = ["authentication", "web-programming"]

[workspace.dependencies]
# Internal crates
tempered_core = { path = "src/tempered_core", version = "0.1.0" }
tempered_axum = { path = "src/tempered_axum", version = "0.1.0" }

# Web framework
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "tower"] }
http = "*"

# Async runtime
tokio = { version = "1.48", features = ["full"] }
async-trait = "0.1"
bytes = "1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
] }
redis = { version = "1.0.1", features = ["tokio-comp", "connection-manager"] }

# Utilities
cookie = "0.18"
url = "2"
uuid = { version = "1.19", features = ["v4", "serde"] }
chrono = "0.4"
time = "0.3"
rand = "0.9.2"
regex = "1.12"
thiserror = "2.0"
secrecy = { version = "0.8", features = ["serde"] }

# Authentication & Security
jsonwebtoken = { version = "10.2", default-features = false, features = [
    "rust_crypto",
] }
argon2 = { version = "0.5.3", features = ["std"] }
sha2 = "0.10"
hmac = "0.12"
metrics = "0.24"
sha1 = "0.10"
base64 = "0.22"

# Configuration
dotenvy = "0.15.7"

# Observability
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = [
    "registry",
    "env-filter",
] }
tracing-error = "0.2.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "cookies",
] }

# Testing dependencies
testcontainers-modules = { version = "0.14", features = [
    "postgres",
    "blocking",
    "redis",
] }
wiremock = "0.6"
fake = "4.4"
quickcheck = "1.0"
quickcheck_macros = "1.1"
