name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Build sqlx queries from the checked-in .sqlx/ data; no database at compile time.
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The API tests start Postgres and Redis through testcontainers, which
      # uses the Docker daemon preinstalled on the runner.
      - run: cargo test --workspace
      # The webauthn-rs verifier is off by default (it links OpenSSL).
      - run: cargo test -p tempered_adapters --features passkeys-webauthn --lib passkey::

  lean:
    name: lean build (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Guards the promise that an in-memory consumer does not compile
      # sqlx / redis / reqwest / webauthn-rs (OpenSSL).
      - run: cargo check -p tempered --no-default-features
      - name: Heavy backends stay out of the lean dependency tree
        run: |
          if cargo tree -p tempered --no-default-features -e normal | grep -E '[ ─](sqlx|redis|reqwest|webauthn-rs|openssl) v'; then
            echo "a heavy backend leaked into the lean build" >&2
            exit 1
          fi
