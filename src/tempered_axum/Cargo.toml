[package]
name = "tempered_axum"
description = "The axum adapter for the tempered authentication library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[test]]
name = "api"
path = "tests/api/main.rs"
harness = true

[dependencies]
# Core authentication library. No default adapter features: which heavy
# backends compile is the top-level consumer's choice (via the facade's
# feature flags); this crate's own code only needs the always-on surface.
tempered_core = { path = "../tempered_core", version = "0.1.0" }
tempered_adapters = { path = "../tempered_adapters", version = "0.1.0", default-features = false }

# Axum framework
axum.workspace = true

http.workspace = true
tower-http.workspace = true

# Async runtime
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Security
secrecy.workspace = true

# Error handling
thiserror.workspace = true

# Tracing
tracing.workspace = true

[dev-dependencies]
# The API tests exercise the real backends, so they enable the heavy features.
tempered_adapters = { path = "../tempered_adapters", features = [
    "postgres",
    "redis",
    "postmark-email",
] }

# Testing
testcontainers-modules.workspace = true
wiremock.workspace = true
reqwest.workspace = true
tower.workspace = true
url.workspace = true

# Database
sqlx.workspace = true
redis.workspace = true

# Utilities
uuid.workspace = true
