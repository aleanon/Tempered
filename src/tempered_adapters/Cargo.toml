[package]
name = "tempered_adapters"
version.workspace = true
edition.workspace = true

[features]
# Building this crate directly (tests, examples) gets everything; slim builds
# opt out via the facade: tempered = { default-features = false, features = [...] }.
default = ["postgres", "redis", "oauth-client", "postmark-email"]
# PostgresUserStore (pulls sqlx).
postgres = ["dep:sqlx"]
# Redis-backed stores: ban list, 2FA codes, reset tokens, token epochs.
redis = ["dep:redis"]
# ReqwestOAuthHttpClient — the outbound HTTP client for the OAuth flow
# (the flow itself and its ports are always available).
oauth-client = ["dep:reqwest"]
# PostmarkEmailClient (MockEmailClient is always available).
postmark-email = ["dep:reqwest"]
# BreachedPasswordCheck (Have I Been Pwned range API).
breached-passwords = ["dep:reqwest"]
# WebAuthnRsVerifier, the production passkey verifier. Off by default even
# here: webauthn-rs links OpenSSL.
passkeys-webauthn = ["dep:webauthn-rs"]

[dependencies]
# Core dependencies
tempered_core.workspace = true

# Async
async-trait.workspace = true
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Database (feature-gated)
sqlx = { workspace = true, optional = true }
redis = { workspace = true, optional = true }

# Utilities
cookie.workspace = true
url.workspace = true
uuid.workspace = true
chrono.workspace = true
time.workspace = true
thiserror.workspace = true
secrecy.workspace = true
rand.workspace = true
http.workspace = true
bytes.workspace = true

# Authentication
jsonwebtoken.workspace = true
argon2.workspace = true
sha2.workspace = true
hmac.workspace = true
sha1.workspace = true
base64.workspace = true

# Configuration
dotenvy.workspace = true

# Observability
tracing.workspace = true

# HTTP client (feature-gated)
reqwest = { workspace = true, optional = true }

# WebAuthn (feature-gated). State serialisation lets the ceremony state
# live in a ChallengeStore between start and finish; conditional-ui allows
# usernameless (discoverable credential) logins.
webauthn-rs = { version = "0.6.2", optional = true, features = ["danger-allow-state-serialisation", "conditional-ui"] }

[dev-dependencies]
wiremock.workspace = true
fake.workspace = true
testcontainers-modules.workspace = true
tokio = { workspace = true, features = ["test-util"] }
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }
