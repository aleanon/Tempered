# Cargo configuration for the workspace

[alias]
# `cargo lint`: clippy over every target and feature.
# (This used to be named `check`, which cargo ignores: aliases cannot shadow built-ins.)
lint = "clippy --workspace --all-targets --all-features"

# Add a strict clippy check that treats warnings as errors
clippy-strict = "clippy --workspace --all-targets --all-features -- -D warnings"

[build]
# Optional: set default features for clippy
# rustflags = ["-W", "clippy::all", "-W", "clippy::pedantic"]
